<style>
/* Layout: one map that fills the width, a stats strip above it, and the
   selected file's function list below. Box colours follow decomp.dev. */
:root {
  --bg: #f3f6f8;
  --panel: #ffffff;
  --fg: #14212b;
  --muted: #5a6b78;
  --line: #d5dee5;
  --accent: #0a74c4;
  --match: #1fa83a;
  --part: #0a74c4;
  --none: #3b4248;
  --map-bg: #1b2126;
  --sel: #ffd23f;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161a; --panel: #182026; --fg: #e3eaef; --muted: #93a3af;
    --line: #2a353d; --accent: #4fb0ff; --map-bg: #0b0e10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161a; --panel: #182026; --fg: #e3eaef; --muted: #93a3af;
  --line: #2a353d; --accent: #4fb0ff; --map-bg: #0b0e10; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 {
  font-family: var(--font-display); font-stretch: 112%; font-weight: 800;
  font-size: clamp(1.5rem, 3.2vw, 2.1rem); margin: 0; letter-spacing: -0.01em;
  text-wrap: balance;
}
.sub { margin: 4px 0 0; color: var(--muted); font-size: 0.92rem; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; font-variant-numeric: tabular-nums; }
.stat { display: grid; }
.stat b { font-family: var(--font-display); font-stretch: 100%; font-size: 1.35rem; font-weight: 700; }
.stat span { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; margin-right: 6px; }
.search { position: relative; flex: 1 1 260px; max-width: 360px; }
.search input {
  width: 100%; font: inherit; padding: 7px 10px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg);
}
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.results {
  position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  max-height: 280px; overflow: auto; margin: 0; padding: 4px; list-style: none;
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.18);
}
.results button {
  width: 100%; text-align: left; font: inherit; font-size: 0.88rem; color: var(--fg);
  background: none; border: 0; padding: 6px 8px; border-radius: 4px; cursor: pointer;
  display: flex; justify-content: space-between; gap: 10px;
}
.results button:hover, .results button:focus-visible { background: var(--line); outline: none; }
.results small { color: var(--muted); font-variant-numeric: tabular-nums; }
.map {
  position: relative; width: 100%; aspect-ratio: 2 / 1; max-width: 100%;
  background: var(--map-bg); border-radius: 8px; overflow: hidden;
}
.map canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
.tip {
  position: absolute; pointer-events: none; z-index: 3; max-width: 320px;
  background: rgb(10 14 17 / 0.92); color: #eef3f6; border-radius: 6px;
  padding: 6px 9px; font-size: 0.8rem; line-height: 1.35;
}
.tip b { font-family: var(--font-mono); font-weight: 600; font-size: 0.78rem; word-break: break-all; }
.detail {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 18px; display: grid; gap: 14px; min-width: 0;
}
.detail h2 {
  margin: 0; font-family: var(--font-mono); font-weight: 600; font-size: 1.05rem;
  word-break: break-all;
}
.dhead { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; justify-content: space-between; }
.dhead a { color: var(--accent); font-weight: 600; text-decoration: none; }
.dhead a:hover { text-decoration: underline; }
.dhead a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.pill {
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 999px; color: #fff;
}
.dstats { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.dstats b { color: var(--fg); }
.fnwrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.86rem; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; padding: 4px 8px; border-bottom: 1px solid var(--line); }
td { padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.fn { font-family: var(--font-mono); font-size: 0.8rem; word-break: break-all; min-width: 240px; }
td.num { text-align: right; white-space: nowrap; }
.bar { width: 90px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; }
.empty { color: var(--muted); margin: 0; }
.foot { color: var(--muted); font-size: 0.8rem; }
@media (max-width: 560px) { .bar { width: 50px; } td.fn { min-width: 180px; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

const REPO = DATA.repo;
const units = DATA.units;
const $ = (id) => document.getElementById(id);
const pct = (v) => (Math.round(v * 100) / 100).toFixed(2) + "%";
const kb = (n) => n >= 1024 ? (n / 1024).toFixed(1) + " KB" : n + " B";

function tok(name) { return name.replace(/[^A-Za-z0-9._~-]/g, "."); }

function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function hexRgb(h) { h = h.replace("#", ""); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); }
function mix(a, b, t) { return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
function unitColour(u) {
  const none = hexRgb(css("--none")), part = hexRgb(css("--part")), match = hexRgb(css("--match"));
  if (u.c > 0 && u.m >= u.c) return match;
  if (u.f <= 0) return none;
  return mix(none, part, 0.35 + 0.65 * Math.pow(u.f / 100, 3));
}
function fnColour(f) {
  if (f >= 100) return css("--match");
  if (f <= 0) return css("--none");
  return css("--part");
}

// --- squarified treemap -------------------------------------------------
function worst(row, side) {
  let s = 0, big = 0, small = Infinity;
  for (const r of row) { s += r.a; big = Math.max(big, r.a); small = Math.min(small, r.a); }
  return Math.max((side * side * big) / (s * s), (s * s) / (side * side * small));
}
function layoutRow(row, rect, out) {
  const s = row.reduce((t, r) => t + r.a, 0);
  let { x, y, w, h } = rect;
  if (w >= h) {
    const cw = s / h; let cy = y;
    for (const r of row) { const ch = r.a / cw; out.push({ item: r.item, x, y: cy, w: cw, h: ch }); cy += ch; }
    return { x: x + cw, y, w: w - cw, h };
  }
  const rh = s / w; let cx = x;
  for (const r of row) { const cw = r.a / rh; out.push({ item: r.item, x: cx, y, w: cw, h: rh }); cx += cw; }
  return { x, y: y + rh, w, h: h - rh };
}
function squarify(items, x, y, w, h) {
  const total = items.reduce((t, i) => t + i.v, 0);
  const out = [];
  if (total <= 0 || w <= 0 || h <= 0) return out;
  const scale = (w * h) / total;
  const rest = items.filter((i) => i.v > 0).map((i) => ({ a: i.v * scale, item: i.item })).sort((p, q) => q.a - p.a);
  let row = [], rect = { x, y, w, h };
  while (rest.length) {
    const side = Math.min(rect.w, rect.h);
    if (!row.length || worst(row.concat([rest[0]]), side) <= worst(row, side)) row.push(rest.shift());
    else { rect = layoutRow(row, rect, out); row = []; }
  }
  if (row.length) layoutRow(row, rect, out);
  return out;
}

// group: category -> folder -> unit
const tree = new Map();
for (const u of units) {
  if (u.c <= 0) continue;
  if (!tree.has(u.cat)) tree.set(u.cat, new Map());
  const folders = tree.get(u.cat);
  const dir = u.p.includes("/") ? u.p.slice(0, u.p.lastIndexOf("/")) : "";
  if (!folders.has(dir)) folders.set(dir, []);
  folders.get(dir).push(u);
}
const sum = (arr) => arr.reduce((t, u) => t + u.c, 0);

let rects = [], groups = [], selected = null, hover = null;
const cv = $("cv"), ctx = cv.getContext("2d");

function layout() {
  const box = $("map").getBoundingClientRect();
  const W = box.width, H = box.height;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  rects = []; groups = [];
  const cats = [...tree.entries()].map(([cat, folders]) => ({ v: [...folders.values()].reduce((t, us) => t + sum(us), 0), item: cat }));
  for (const c of squarify(cats, 0, 0, W, H)) {
    groups.push({ name: DATA.catNames[c.item] || c.item, x: c.x, y: c.y, w: c.w, h: c.h });
    const folders = tree.get(c.item);
    const fitems = [...folders.entries()].map(([dir, us]) => ({ v: sum(us), item: dir }));
    for (const f of squarify(fitems, c.x, c.y, c.w, c.h)) {
      for (const r of squarify(folders.get(f.item).map((u) => ({ v: u.c, item: u })), f.x, f.y, f.w, f.h)) rects.push(r);
    }
  }
  draw();
}

function draw() {
  const box = $("map").getBoundingClientRect();
  ctx.fillStyle = css("--map-bg");
  ctx.fillRect(0, 0, box.width, box.height);
  for (const r of rects) {
    const [cr, cg, cb] = unitColour(r.item);
    ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = "rgba(0,0,0,0.75)"; ctx.lineWidth = 0.6;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
  }
  ctx.lineWidth = 2; ctx.strokeStyle = "#000";
  for (const g of groups) ctx.strokeRect(g.x, g.y, g.w, g.h);
  for (const r of [hover, selected]) {
    if (!r) continue;
    ctx.lineWidth = r === selected ? 3 : 2;
    ctx.strokeStyle = r === selected ? css("--sel") : "#fff";
    ctx.strokeRect(r.x + 1, r.y + 1, Math.max(r.w - 2, 1), Math.max(r.h - 2, 1));
  }
  // category labels
  ctx.font = `700 12px ${css("--font-display")}`;
  ctx.textBaseline = "top";
  for (const g of groups) {
    if (g.w < 90 || g.h < 30) continue;
    const label = g.name;
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(g.x + 6, g.y + 6, tw + 10, 18);
    ctx.fillStyle = "#fff";
    ctx.fillText(label, g.x + 11, g.y + 9);
  }
}

function hit(ev) {
  const b = cv.getBoundingClientRect();
  const x = ev.clientX - b.left, y = ev.clientY - b.top;
  for (const r of rects) if (x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h) return { r, x, y };
  return null;
}

cv.addEventListener("mousemove", (ev) => {
  const h = hit(ev);
  const tip = $("tip");
  if (!h) { hover = null; tip.hidden = true; draw(); return; }
  if (hover !== h.r) { hover = h.r; draw(); }
  const u = h.r.item;
  tip.innerHTML = `<b>${esc(u.n)}</b><br>${pct(u.m / u.c * 100)} matched · ${pct(u.f)} fuzzy · ${kb(u.c)}`;
  tip.hidden = false;
  const mb = $("map").getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(h.x + 14, mb.width - tw - 6) + "px";
  tip.style.top = (h.y + 14 + th > mb.height ? h.y - th - 10 : h.y + 14) + "px";
});
cv.addEventListener("mouseleave", () => { hover = null; $("tip").hidden = true; draw(); });
cv.addEventListener("click", (ev) => { const h = hit(ev); if (h) select(h.r.item, true); });

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

function select(u, scroll) {
  selected = rects.find((r) => r.item === u) || null;
  draw();
  try { history.replaceState(null, "", "#" + tok(u.n)); } catch (e) {}
  const matchedFns = u.fn.filter((f) => f[2] >= 100).length;
  const status = u.c > 0 && u.m >= u.c ? ["Complete", "--match"] : u.f <= 0 ? ["Not started", "--none"] : ["In progress", "--part"];
  const rows = u.fn.map((f) => `<tr><td class="fn">${esc(f[0])}</td><td class="num">${f[1]}</td>`
    + `<td class="num">${f[2] < 0 ? "–" : pct(f[2])}</td>`
    + `<td><div class="bar"><i style="width:${Math.max(0, f[2])}%;background:${fnColour(f[2])}"></i></div></td></tr>`).join("");
  $("detail").innerHTML = `
    <div class="dhead">
      <h2>${esc(u.p)}</h2>
      <a href="${REPO}/blob/main/${encodeURI(u.p)}" target="_blank" rel="noopener">Open source on GitHub ↗</a>
    </div>
    <div class="dstats">
      <span class="pill" style="background:var(${status[1]})">${status[0]}</span>
      <span><b>${pct(u.m / u.c * 100)}</b> code matched</span>
      <span><b>${pct(u.f)}</b> fuzzy</span>
      <span><b>${matchedFns} / ${u.fn.length}</b> functions match</span>
      <span><b>${kb(u.c)}</b> of code</span>
    </div>
    <div class="fnwrap"><table>
      <thead><tr><th>Function</th><th class="num">Bytes</th><th class="num">Match</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  if (scroll) $("detail").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}

function header() {
  const t = DATA.total;
  $("sub").textContent = `Super Mario Sunshine (US; GMSE01) · ${t.units} source files · built ${DATA.built}`;
  const items = [
    [pct(t.matched), "code matched"],
    [pct(t.fuzzy), "fuzzy"],
    [`${t.mfn.toLocaleString()} / ${t.fns.toLocaleString()}`, "functions match"],
    [`${t.done} / ${t.units}`, "files complete"],
  ];
  $("stats").innerHTML = items.map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
  $("foot").textContent = "Click a box to see its functions. Hover for name and percentage. Use the search box to jump to a file.";
}

// search
const q = $("q"), results = $("results");
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase();
  if (!s) { results.hidden = true; return; }
  const hits = units.filter((u) => u.c > 0 && u.n.toLowerCase().includes(s)).slice(0, 30);
  results.innerHTML = hits.length ? hits.map((u, i) => `<li><button type="button" data-i="${units.indexOf(u)}">${esc(u.n)}<small>${pct(u.f)}</small></button></li>`).join("")
    : `<li style="padding:6px 8px;color:var(--muted)">No file matches “${esc(q.value)}”.</li>`;
  results.hidden = false;
});
results.addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  select(units[+b.dataset.i], true); results.hidden = true; q.value = "";
});
document.addEventListener("click", (ev) => { if (!ev.target.closest(".search")) results.hidden = true; });

header();
layout();
new ResizeObserver(() => layout()).observe($("map"));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

const start = location.hash.slice(1);
const initial = units.find((u) => tok(u.n) === start) || units.find((u) => u.n === "Enemy/koopajr") || units.find((u) => u.c > 0);
select(initial, false);
</script>
